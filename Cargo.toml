[package]
name = "btech"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"

[dependencies]
anyhow = "1"
bitcoin = "0.32"
dkgkit-nostr = { git = "https://github.com/cheng-chun-yuan/dkgkit", rev = "751ed81", features = ["live"] }
dkgkit-sdk = { git = "https://github.com/cheng-chun-yuan/dkgkit", rev = "751ed81" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
nostr-sdk = { version = "0.44", default-features = false, features = ["nip44"] }

[[bin]]
name = "btech"
path = "src/main.rs"

[[bin]]
name = "vaultd"
path = "src/bin/vaultd.rs"

[[bin]]
name = "relaydemo"
path = "src/bin/relaydemo.rs"
